<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS Meme Slider</title>
</head>
<body>
    <div class="slider-wrapper">
        <input type="radio" name="slider" id="slide1" checked>
        <input type="radio" name="slider" id="slide2">
        <input type="radio" name="slider" id="slide3">
        <input type="radio" name="slider" id="slide4">
        <div class="slides-container">
            <div class="slide">
                <img src="assets/1.jpg" alt="Cyberpunk meme">
                <p>Waking up in 2077 just to realize the city didn't burn, it just glitched</p>
            </div>
            <div class="slide">
                <img src="assets/2.jpg" alt="Witcher 3">
                <p>How about a round of Gwent?</p>
            </div>
            <div class="slide">
                <img src="assets/3.jpg" alt="World of Warcraft">
                <p>Me at 3am: "Just one more quest and going to sleep"</p>
            </div>
            <div class="slide">
                <img src="assets/4.jpg" alt="Red Dead Redemption 2">
                <p>Arthur listening to Dutch explaining his "goddamn plan" for the 100th time</p>
            </div>
        </div>
        <div class="controls">
            <label for="slide1"></label>
            <label for="slide2"></label>
            <label for="slide3"></label>
            <label for="slide4"></label>
        </div>
    </div>
    
</body>
</html>
